<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <title>VideoShare - Watch</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#FF334B',
              crimson: '#E50914',
              orange: '#FF5E3A',
              dark: '#0D0D11',
              card: '#16161E',
              cardBorder: '#252533',
              tagBg: '#1F202B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body oncontextmenu="return false;" class="bg-[#0D0D11] text-slate-100 font-sans pb-10 antialiased selection:bg-brand-red selection:text-white select-none">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 bg-[#0D0D11]/95 backdrop-blur-md border-b border-brand-cardBorder/60 px-3.5 py-2.5 flex items-center justify-between">
    <div onclick="resetFilters()" class="flex items-center space-x-2 cursor-pointer">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-red-500 flex items-center justify-center shadow-lg shadow-red-500/20 text-lg">
        🦊
      </div>
      <div class="flex items-center tracking-tight font-black text-lg">
        <span class="text-brand-red">VIDEO</span><span class="text-white">SHARE</span>
      </div>
    </div>

    <div class="flex items-center space-x-2.5">
      <button onclick="toggleSearch()" aria-label="Search" class="p-2 text-gray-300 hover:text-white bg-[#181822] border border-brand-cardBorder rounded-full active:scale-95 transition" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" x2="16.65" y1="21" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Expandable Search Bar -->
  <div id="search-bar-wrapper" class="hidden px-3.5 py-2 bg-[#121218] border-b border-brand-cardBorder">
    <div class="relative flex items-center">
      <input id="search-input" oninput="handleSearch(this.value)" type="text" placeholder="Search videos, channels, or tags..." class="w-full bg-[#1C1D26] text-xs text-white placeholder-gray-500 rounded-full pl-3.5 pr-8 py-2 border border-brand-cardBorder focus:border-brand-red focus:outline-none select-text" />
      <button onclick="clearSearch()" class="absolute right-2.5 text-gray-400 hover:text-white text-xs font-bold" type="button">✕</button>
    </div>
  </div>

  <!-- Category Filter Chips -->
  <nav id="category-nav" aria-label="Categories" class="flex items-center space-x-2 px-3.5 py-2.5 overflow-x-auto no-scrollbar border-b border-brand-cardBorder/40 text-xs font-medium bg-[#111116]">
    <button onclick="filterByCategory('All')" data-cat="All" class="cat-chip px-3.5 py-1.5 rounded-full bg-white text-black font-semibold whitespace-nowrap transition" type="button">All</button>
    <button onclick="filterByCategory('Animation')" data-cat="Animation" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Animation</button>
    <button onclick="filterByCategory('3D')" data-cat="3D" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">3D</button>
    <button onclick="filterByCategory('Sci-Fi')" data-cat="Sci-Fi" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Sci-Fi</button>
    <button onclick="filterByCategory('Gaming')" data-cat="Gaming" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Gaming</button>
    <button onclick="filterByCategory('Movies')" data-cat="Movies" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Movies</button>
  </nav>

  <!-- TOP BANNER AD SLOT (320x50 - Above Video Player) -->
  <div id="top-banner-ad" class="w-full flex justify-center items-center py-2 bg-[#0A0A0E] border-b border-brand-cardBorder/40">
    <div id="banner-320x50-slot" class="w-[320px] h-[50px] flex items-center justify-center overflow-hidden rounded"></div>
  </div>

  <!-- Main Video Player -->
  <section id="player-sentinel" class="w-full max-w-4xl mx-auto">
    <div id="player-slot-wrapper" class="relative w-full aspect-video bg-black overflow-hidden border-b border-brand-cardBorder/60 sm:rounded-b-xl">
      <div id="player-box" onclick="handlePlayerBoxClick()" class="w-full h-full bg-black overflow-hidden relative">
        <video
          id="main-video-player"
          class="w-full h-full object-contain bg-black hidden pointer-events-none"
          playsinline
          preload="auto"
          disablePictureInPicture
          oncontextmenu="return false;">
          Your browser does not support the HTML5 video tag.
        </video>

        <!-- Buffering Spinner -->
        <div id="video-buffering" class="hidden absolute inset-0 z-10 flex items-center justify-center bg-black/35 pointer-events-none">
          <div class="w-8 h-8 rounded-full border-2 border-white/25 border-t-brand-red animate-spin"></div>
        </div>

        <!-- Mini Player Controls: ONLY Play / Pause -->
        <div id="mini-player-controls" class="hidden absolute inset-0 z-20 flex items-center justify-center bg-black/25">
          <button
            onclick="handlePlayPauseClick(event)"
            aria-label="Play or Pause"
            class="w-10 h-10 rounded-full bg-black/75 hover:bg-brand-red text-white flex items-center justify-center border border-white/25 backdrop-blur-sm active:scale-95 transition"
            type="button">
            <svg class="mini-icon-play w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"></path>
            </svg>
            <svg class="mini-icon-pause w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
            </svg>
          </button>
        </div>

        <!-- Normal Mode Video Controller Bar (No Skip Forward/Backward) -->
        <div id="normal-video-controller" onclick="event.stopPropagation()" class="hidden absolute inset-x-0 bottom-0 z-20 px-3 py-2 bg-gradient-to-t from-black/85 via-black/45 to-transparent flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center space-x-2.5">
            <button
              onclick="handlePlayPauseClick(event)"
              aria-label="Play or Pause"
              class="w-8 h-8 rounded-full bg-white/15 hover:bg-brand-red text-white flex items-center justify-center transition"
              type="button">
              <svg class="norm-icon-play w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"></path>
              </svg>
              <svg class="norm-icon-pause w-3.5 h-3.5 fill-current hidden" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
              </svg>
            </button>

            <button
              id="mute-toggle-btn"
              onclick="toggleMute(event)"
              aria-label="Mute or Unmute"
              class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition"
              type="button">
              <svg id="icon-vol-on" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>
              </svg>
              <svg id="icon-vol-off" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>
              </svg>
            </button>

            <span id="video-time-display" class="text-[11px] font-mono text-gray-200">00:00 / 00:00</span>
          </div>

          <button
            id="fullscreen-btn"
            onclick="toggleFullscreen(event)"
            aria-label="Fullscreen"
            class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition"
            type="button">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path>
            </svg>
          </button>
        </div>

        <div id="empty-player-placeholder" class="w-full h-full flex flex-col items-center justify-center text-center p-4 bg-[#121218]">
          <p class="text-sm font-bold text-gray-200 mb-1">Loading Video...</p>
          <p class="text-xs text-gray-400">Fetching stream from <code class="text-gray-200">videos.json</code></p>
        </div>
      </div>

      <!-- Docked Notice While Floating -->
      <div id="floating-dock-notice" class="hidden w-full h-full flex flex-col items-center justify-center bg-[#121218] text-gray-400 text-xs">
        <p class="mb-2">Playing in mini-player</p>
        <button onclick="scrollToPlayerTop(event)" class="px-3 py-1.5 rounded-full bg-[#1F202B] text-white font-semibold border border-brand-cardBorder" type="button">
          Bring Back Here
        </button>
      </div>
    </div>
  </section>

  <!-- Video Details & Channel -->
  <section id="video-details-section" class="max-w-4xl mx-auto px-3.5 pt-3 pb-2 hidden">
    <div class="mb-2">
      <h1 id="video-title" class="text-base font-bold text-white tracking-tight leading-snug"></h1>
      <div id="video-hashtags" class="flex flex-wrap items-center gap-1.5 text-[11px] text-brand-red font-medium mt-1"></div>
    </div>

    <div class="flex items-center justify-between py-2 border-y border-brand-cardBorder/60 my-2">
      <div class="flex items-center space-x-2.5">
        <div class="relative w-10 h-10 rounded-full overflow-hidden ring-2 ring-brand-red/80 bg-slate-800 flex items-center justify-center font-bold text-sm text-white shrink-0">
          <img id="channel-avatar" alt="Channel Avatar" class="w-full h-full object-cover" src="" />
        </div>
        <div>
          <div class="flex items-center space-x-1">
            <span id="channel-name" class="text-sm font-bold text-white"></span>
            <svg class="w-3.5 h-3.5 text-brand-red fill-current shrink-0" viewBox="0 0 20 20">
              <path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
            </svg>
          </div>
          <span id="channel-subs" class="text-[11px] text-gray-400"></span>
        </div>
      </div>

      <button id="subscribe-btn" onclick="toggleSubscribe()" class="px-4 py-1.5 bg-brand-crimson hover:bg-red-600 active:scale-95 text-white text-xs font-bold rounded-full shadow-md shadow-brand-crimson/30 transition shrink-0" type="button">
        Subscribe
      </button>
    </div>
  </section>

  <!-- Action Bar (Like / Dislike / Favorite / Share) -->
  <section id="video-actions-section" class="max-w-4xl mx-auto px-3.5 py-1.5 overflow-x-auto no-scrollbar hidden">
    <div class="flex items-center space-x-2 text-xs font-semibold">
      <div class="inline-flex items-center rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200">
        <button id="like-btn" onclick="toggleLike()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 hover:text-white active:scale-95 border-r border-brand-cardBorder transition" type="button">
          <svg id="like-icon" class="w-4 h-4 fill-white" viewBox="0 0 24 24">
            <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path>
          </svg>
          <span id="like-count" class="text-[11px] font-bold">0</span>
        </button>
        <button id="dislike-btn" onclick="toggleDislike()" class="inline-flex items-center px-2.5 py-1.5 hover:text-white active:scale-95 text-gray-400 transition" type="button">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path>
          </svg>
          <span id="dislike-count" class="text-[10px] ml-1">0</span>
        </button>
      </div>

      <button id="fav-btn" onclick="toggleFavorite()" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200 hover:text-pink-400 whitespace-nowrap active:scale-95 transition" type="button">
        <svg id="fav-icon" class="w-4 h-4 text-gray-400 fill-current transition" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
        </svg>
        <span class="text-[11px]">Favorite</span>
      </button>

      <button id="share-btn" onclick="shareCurrentVideo()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200 hover:text-white whitespace-nowrap active:scale-95 transition" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span class="text-[11px]">Share</span>
      </button>
    </div>
  </section>

  <!-- Expandable Description -->
  <section id="video-desc-section" class="max-w-4xl mx-auto px-3.5 my-2 hidden">
    <div onclick="toggleDescription()" class="bg-[#15151D] border border-brand-cardBorder/70 rounded-xl p-3 text-xs text-gray-300 cursor-pointer hover:border-brand-cardBorder transition">
      <div class="flex items-center justify-between font-semibold text-white mb-1.5">
        <div class="flex items-center space-x-2">
          <span id="video-views"></span>
          <span class="text-gray-500">•</span>
          <span id="video-date" class="text-gray-400"></span>
        </div>
        <span id="desc-toggle-label" class="text-[11px] font-bold text-brand-red flex items-center">More</span>
      </div>
      <p id="video-description" class="text-gray-300 line-clamp-2 leading-relaxed"></p>
    </div>
  </section>

  <!-- MIDDLE BANNER AD SLOT (300x250) -->
  <div id="middle-banner-ad" class="max-w-4xl mx-auto px-3.5 my-3 flex justify-center">
    <div id="banner-300x250-slot" class="w-[300px] h-[250px] flex items-center justify-center overflow-hidden rounded-xl bg-[#13131A] border border-brand-cardBorder/60"></div>
  </div>

  <!-- Up Next Recommendations Feed (2 Videos Per Row) -->
  <section class="max-w-4xl mx-auto px-3.5 pt-2">
    <div class="flex items-center justify-between mb-2.5">
      <div class="flex items-center space-x-2">
        <h2 class="text-sm font-bold text-white">Up Next</h2>
        <span id="queue-count" class="text-[10px] bg-brand-red/20 text-brand-red font-semibold px-1.5 py-0.5 rounded">0 Videos</span>
      </div>
    </div>

    <div class="flex items-center space-x-2 pb-2.5 overflow-x-auto no-scrollbar text-xs">
      <button onclick="setFeedFilter('all')" data-feed="all" class="feed-pill px-3 py-1 rounded-full bg-white text-black font-semibold whitespace-nowrap" type="button">All</button>
      <button onclick="setFeedFilter('favorites')" data-feed="favorites" class="feed-pill px-3 py-1 rounded-full bg-[#1A1A24] text-gray-300 border border-brand-cardBorder whitespace-nowrap" type="button">Favorites</button>
    </div>

    <div id="recommendations-list" class="grid grid-cols-2 gap-3 mt-1"></div>
  </section>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] hidden bg-[#1F202B] text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-brand-red/50 shadow-xl">
    Notification
  </div>

  <!-- Social Bar & Popunder Dynamic Container -->
  <div id="ad-scripts-container" class="hidden"></div>

  <script src="./app.js"></script>
</body>
</html>
