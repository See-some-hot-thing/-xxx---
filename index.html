<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player-wrapper" id="playerWrapper">
    <div class="video-stage" id="videoStage">
      <video id="videoPlayer" playsinline preload="metadata">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
      </video>

      <!-- Top Bar -->
      <div class="top-bar">
        <div class="video-title" id="videoTitle">Shuuchuu Chiryou Shitsu 2</div>
        <div class="top-actions">
          <button type="button" class="pill-btn" id="speedBtn" title="Playback Speed">1x</button>
          <button type="button" class="icon-btn" id="pipBtn" title="Picture in Picture">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <rect x="11" y="11" width="7" height="6" rx="1"></rect>
              <path d="M7 10l4-4M11 6H8M11 6v3"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Center Controls (-10s, Play/Pause, +10s) -->
      <div class="center-controls">
        <button type="button" class="seek-btn" id="rewindBtn" title="Rewind 10s">
          <span class="seek-label">-10s</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button type="button" class="center-play-btn" id="centerPlayBtn" title="Play / Pause">
          <svg id="centerPlayIcon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </button>

        <button type="button" class="seek-btn" id="forwardBtn" title="Forward 10s">
          <span class="seek-label">+10s</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </svg>
        </button>
      </div>

      <!-- Bottom Controls -->
      <div class="bottom-bar">
        <div class="timeline-row">
          <span class="time-text" id="currentTime">0:00</span>
          <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" step="0.1" />
          <span class="time-text" id="durationTime">0:00</span>
        </div>

        <div class="controls-row">
          <div class="left-controls">
            <button type="button" class="icon-btn" id="playPauseBtn" title="Play / Pause">
              <svg id="bottomPlayIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"></path>
              </svg>
            </button>

            <button type="button" class="icon-btn" id="nextBtn" title="Next Video">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 4l10 8-10 8V4z"></path>
                <line x1="19" y1="5" x2="19" y2="19"></line>
              </svg>
            </button>
          </div>

          <div class="right-controls">
            <span class="quality-badge" id="qualityBadge">HD 720p</span>

            <button type="button" class="icon-btn" id="muteBtn" title="Mute / Unmute">
              <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>

            <button type="button" class="icon-btn" id="fullscreenBtn" title="Fullscreen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
                <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
                <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Bar (Like / Dislike / Save / Download / Report) -->
    <div class="action-bar">
      <button type="button" class="action-item" id="likeBtn">
        <span class="action-icon">👍</span>
        <span class="action-count" id="likeCount">186</span>
      </button>

      <button type="button" class="action-item" id="dislikeBtn">
        <span class="action-icon">👎</span>
        <span class="action-count" id="dislikeCount">17</span>
      </button>

      <button type="button" class="action-item" id="saveBtn">
        <span class="action-icon">🔖</span>
        <span class="action-label" id="saveLabel">Save</span>
      </button>

      <a class="action-item" id="downloadLink" href="#" download>
        <span class="action-icon">⬇️</span>
        <span class="action-label">Download</span>
      </a>

      <button type="button" class="action-item" id="reportBtn">
        <span class="action-icon">🐞</span>
        <span class="action-label">Report</span>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
