<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ভিডিও গ্যালারি</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .video-card { background: #1e1e1e; padding: 15px; border-radius: 10px; }
    video { width: 100%; border-radius: 8px; }
    h3 { margin: 10px 0 0; font-size: 18px; }
  </style>
</head>
<body>

  <h2>ভিডিও সমূহ</h2>
  <div id="video-container" class="video-grid">লোড হচ্ছে...</div>

  <script>
    const WORKER_URL = "https://" + "my-video-api.rabbipersonaluse" + ".workers.dev";
    const SECRET_TOKEN = "AmarSecretKey12345";

    const container = document.getElementById("video-container");

    fetch(WORKER_URL, {
      method: "GET",
      headers: {
        "X-Custom-Token": SECRET_TOKEN
      }
    })
    .then(response => {
      if (!response.ok) throw new Error("ভিডিও লোড করা সম্ভব হচ্ছে না! Status: " + response.status);
      return response.json();
    })
    .then(videos => {
      container.innerHTML = "";

      videos.forEach(video => {
        const card = document.createElement("div");
        card.className = "video-card";

        card.innerHTML = `
          <video controls preload="metadata" controlsList="nodownload" src="${video.url}">
            আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
          </video>
          <h3>${video.title}</h3>
        `;

        container.appendChild(card);
      });
    })
    .catch(error => {
      container.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
    });
  </script>

</body>
</html>
