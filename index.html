<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <title>VideoShare - Watch</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#FF334B',
              crimson: '#E50914',
              orange: '#FF5E3A',
              dark: '#0D0D11',
              card: '#16161E',
              cardBorder: '#252533',
              tagBg: '#1F202B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .native-ad-card {
      background: #13131A;
      border: 1px solid rgba(37, 37, 51, 0.75);
      border-radius: 0.75rem;
      padding: 0.625rem;
    }

    /* YouTube-Style Draggable Floating Mini Player */
    #player-box.is-floating {
      position: fixed;
      width: 210px;
      height: 118px;
      z-index: 60;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 51, 75, 0.75);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.85);
      touch-action: none;
      cursor: grab;
      transition: box-shadow 0.2s ease;
    }

    #player-box.is-floating:active {
      cursor: grabbing;
    }

    video::-internal-media-controls-download-button {
      display: none;
    }

    video::-webkit-media-controls-enclosure {
      overflow: hidden;
    }
  </style>
</head>
<body oncontextmenu="return false;" class="bg-[#0D0D11] text-slate-100 font-sans pb-10 antialiased selection:bg-brand-red selection:text-white select-none">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 bg-[#0D0D11]/95 backdrop-blur-md border-b border-brand-cardBorder/60 px-3.5 py-2.5 flex items-center justify-between">
    <div onclick="resetFilters()" class="flex items-center space-x-2 cursor-pointer">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-red-500 flex items-center justify-center shadow-lg shadow-red-500/20 text-lg">
        🦊
      </div>
      <div class="flex items-center tracking-tight font-black text-lg">
        <span class="text-brand-red">VIDEO</span><span class="text-white">SHARE</span>
      </div>
    </div>

    <div class="flex items-center space-x-2.5">
      <button onclick="toggleSearch()" aria-label="Search" class="p-2 text-gray-300 hover:text-white bg-[#181822] border border-brand-cardBorder rounded-full active:scale-95 transition" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" x2="16.65" y1="21" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Expandable Search Bar -->
  <div id="search-bar-wrapper" class="hidden px-3.5 py-2 bg-[#121218] border-b border-brand-cardBorder">
    <div class="relative flex items-center">
      <input id="search-input" oninput="handleSearch(this.value)" type="text" placeholder="Search videos, channels, or tags..." class="w-full bg-[#1C1D26] text-xs text-white placeholder-gray-500 rounded-full pl-3.5 pr-8 py-2 border border-brand-cardBorder focus:border-brand-red focus:outline-none select-text" />
      <button onclick="clearSearch()" class="absolute right-2.5 text-gray-400 hover:text-white text-xs font-bold" type="button">✕</button>
    </div>
  </div>

  <!-- Category Filter Chips -->
  <nav id="category-nav" aria-label="Categories" class="flex items-center space-x-2 px-3.5 py-2.5 overflow-x-auto no-scrollbar border-b border-brand-cardBorder/40 text-xs font-medium bg-[#111116]">
    <button onclick="filterByCategory('All')" data-cat="All" class="cat-chip px-3.5 py-1.5 rounded-full bg-white text-black font-semibold whitespace-nowrap transition" type="button">All</button>
    <button onclick="filterByCategory('Animation')" data-cat="Animation" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Animation</button>
    <button onclick="filterByCategory('3D')" data-cat="3D" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">3D</button>
    <button onclick="filterByCategory('Sci-Fi')" data-cat="Sci-Fi" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Sci-Fi</button>
    <button onclick="filterByCategory('Gaming')" data-cat="Gaming" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Gaming</button>
    <button onclick="filterByCategory('Movies')" data-cat="Movies" class="cat-chip px-3.5 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition" type="button">Movies</button>
  </nav>

  <!-- Main Direct Video Player (Loaded BEFORE Ads) -->
  <section id="player-sentinel" class="w-full max-w-4xl mx-auto">
    <div id="player-slot-wrapper" class="relative w-full aspect-video bg-black overflow-hidden border-b border-brand-cardBorder/60 sm:rounded-b-xl">
      <div id="player-box" class="w-full h-full bg-black overflow-hidden relative">
        <!-- Floating Mini-Player Top Controls -->
        <div id="floating-controls" class="hidden absolute top-1.5 left-1.5 right-1.5 z-20 flex items-center justify-between pointer-events-none">
          <button onclick="scrollToPlayerTop(event)" title="Expand" class="pointer-events-auto bg-black/75 hover:bg-black text-white text-[11px] font-bold px-2 py-0.5 rounded-md border border-white/20 backdrop-blur-sm" type="button">
            ⤢
          </button>
          <span class="text-[9px] font-semibold uppercase tracking-wider bg-black/60 text-gray-200 px-1.5 py-0.5 rounded">Drag</span>
          <button onclick="dismissFloatingPlayer(event)" title="Close Mini Player" class="pointer-events-auto bg-black/75 hover:bg-brand-red text-white text-[11px] font-bold px-2 py-0.5 rounded-md border border-white/20 backdrop-blur-sm" type="button">
            ✕
          </button>
        </div>

        <video
          id="main-video-player"
          class="w-full h-full object-contain bg-black hidden"
          controls
          playsinline
          preload="auto"
          disablePictureInPicture
          controlsList="nodownload noremoteplayback"
          oncontextmenu="return false;">
          Your browser does not support the HTML5 video tag.
        </video>

        <div id="empty-player-placeholder" class="w-full h-full flex flex-col items-center justify-center text-center p-4 bg-[#121218]">
          <p class="text-sm font-bold text-gray-200 mb-1">Loading Video...</p>
          <p class="text-xs text-gray-400">Fetching stream from <code class="text-gray-200">videos.json</code></p>
        </div>
      </div>

      <!-- Placeholder shown in original spot while floating -->
      <div id="floating-dock-notice" class="hidden w-full h-full flex flex-col items-center justify-center bg-[#121218] text-gray-400 text-xs">
        <p class="mb-2">Playing in mini-player</p>
        <button onclick="scrollToPlayerTop(event)" class="px-3 py-1.5 rounded-full bg-[#1F202B] text-white font-semibold border border-brand-cardBorder" type="button">
          Return to Player
        </button>
      </div>
    </div>
  </section>

  <!-- TOP BANNER AD SLOT (320x50 - Loads AFTER Video) -->
  <div id="top-banner-ad" class="w-full flex justify-center items-center py-2 bg-[#0A0A0E] border-b border-brand-cardBorder/40">
    <div id="banner-320x50-slot" class="w-[320px] h-[50px] flex items-center justify-center overflow-hidden rounded"></div>
  </div>

  <!-- Video Details & Channel -->
  <section id="video-details-section" class="max-w-4xl mx-auto px-3.5 pt-3 pb-2 hidden">
    <div class="mb-2">
      <h1 id="video-title" class="text-base font-bold text-white tracking-tight leading-snug"></h1>
      <div id="video-hashtags" class="flex flex-wrap items-center gap-1.5 text-[11px] text-brand-red font-medium mt-1"></div>
    </div>

    <div class="flex items-center justify-between py-2 border-y border-brand-cardBorder/60 my-2">
      <div class="flex items-center space-x-2.5">
        <div class="relative w-10 h-10 rounded-full overflow-hidden ring-2 ring-brand-red/80 bg-slate-800 flex items-center justify-center font-bold text-sm text-white shrink-0">
          <img id="channel-avatar" alt="Channel Avatar" class="w-full h-full object-cover" src="" />
        </div>
        <div>
          <div class="flex items-center space-x-1">
            <span id="channel-name" class="text-sm font-bold text-white"></span>
            <svg class="w-3.5 h-3.5 text-brand-red fill-current shrink-0" viewBox="0 0 20 20">
              <path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
            </svg>
          </div>
          <span id="channel-subs" class="text-[11px] text-gray-400"></span>
        </div>
      </div>

      <button id="subscribe-btn" onclick="toggleSubscribe()" class="px-4 py-1.5 bg-brand-crimson hover:bg-red-600 active:scale-95 text-white text-xs font-bold rounded-full shadow-md shadow-brand-crimson/30 transition shrink-0" type="button">
        Subscribe

  <!-- Action Bar (Like / Dislike / Favorite / Share) -->

    <div class="flex items-center space-x-2 text-xs font-semibold">
      <div class="inline-flex items-center rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200">
        <button id="like-btn" onclick="toggleLike()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 hover:text-white active:scale-95 border-r border-brand-cardBorder transition" type="button">
          <svg id="like-icon" class="w-4 h-4 fill-white" viewBox="0 0 24 24">
            <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path>
          </svg>
          <span id="like-count" class="text-[11px] font-bold">0</span>
        </button>
        <button id="dislike-btn" onclick="toggleDislike()" class="inline-flex items-center px-2.5 py-1.5 hover:text-white active:scale-95 text-gray-400 transition" type="button">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path>
          </svg>

      </div>

      <button id="fav-btn" onclick="toggleFavorite()" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200 hover:text-pink-400 whitespace-nowrap active:scale-95 transition" type="button">
        <svg id="fav-icon" class="w-4 h-4 text-gray-400 fill-current transition" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
        </svg>
        <span class="text-[11px]">Favorite</span>
      </button>

      <button id="share-btn" onclick="shareCurrentVideo()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-[#181822] border border-brand-cardBorder text-gray-200 hover:text-white whitespace-nowrap active:scale-95 transition" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span class="text-[11px]">Share</span>
      </button>
    </div>

  <!-- Expandable Description -->

    <div onclick="toggleDescription()" class="bg-[#15151D] border border-brand-cardBorder/70 rounded-xl p-3 text-xs text-gray-300 cursor-pointer hover:border-brand-cardBorder transition">
      <div class="flex items-center justify-between font-semibold text-white mb-1.5">
        <div class="flex items-center space-x-2">
          <span id="video-views"></span>

          <span id="video-date" class="text-gray-400"></span>

        <span id="desc-toggle-label" class="text-[11px] font-bold text-brand-red flex items-center">More</span>
      </div>
      <p id="video-description" class="text-gray-300 line-clamp-2 leading-relaxed"></p>
    </div>
  </section>

  <!-- MIDDLE BANNER AD SLOT (300x250) -->
  <div id="middle-banner-ad" class="max-w-4xl mx-auto px-3.5 my-3 flex justify-center">
    <div id="banner-300x250-slot" class="w-[300px] h-[250px] flex items-center justify-center overflow-hidden rounded-xl bg-[#13131A] border border-brand-cardBorder/60"></div>
  </div>

  <!-- Up Next Recommendations Feed -->

    <div class="flex items-center justify-between mb-2.5">
      <div class="flex items-center space-x-2">

      </div>
    </div>

    <div class="flex items-center space-x-2 pb-2.5 overflow-x-auto no-scrollbar text-xs">
      <button onclick="setFeedFilter('all')" data-feed="all" class="feed-pill px-3 py-1 rounded-full bg-white text-black font-semibold whitespace-nowrap" type="button">All</button>
      <button onclick="setFeedFilter('favorites')" data-feed="favorites" class="feed-pill px-3 py-1 rounded-full bg-[#1A1A24] text-gray-300 border border-brand-cardBorder whitespace-nowrap" type="button">Favorites</button>
    </div>

    <div id="recommendations-list" class="space-y-3 mt-1"></div>
  </section>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] hidden bg-[#1F202B] text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-brand-red/50 shadow-xl">
    Notification
  </div>

  <!-- Social Bar & Popunder Dynamic Container -->
  <div id="ad-scripts-container" class="hidden"></div>

  <script>
    const DEFAULT_THUMB = "https://lh3.googleusercontent.com/aida-public/AB6AXuCYU1tgUo1HVlvVKqbjPyvMdEu1QeD-0DJgdlc_NZizO1MMTT4Au1CbMtcXze7xApFcL3m9n1NnHv1svw-LtrEfXD1RNN9gZO6gwlAkYL9A_byetE3dg6nLfwDdxug6S8ZL0gTFh8XUE3l1phEQNTJ3HMvh33wfsKnlOKBiUK-VRA8ZZKbG8UQKhggHEEWEGjUDuldumQAHrftHBlmsLNzSPKOvdKoaU7YOKPR0QWGNzGXb4i0yUsUR";

    // ==========================================
    // 3. ANTI-DOWNLOAD / SHORTCUT BLOCKING
    // ==========================================
    document.addEventListener("keydown", (e) => {
      if (
        (e.ctrlKey && (e.key === "s" || e.key === "S" || e.key === "u" || e.key === "U")) ||
        (e.ctrlKey && e.shiftKey && (e.key === "i" || e.key === "I" || e.key === "j" || e.key === "J")) ||
        e.key === "F12"
      ) {
        e.preventDefault();
      }
    });

    // ==========================================
    // AD CONFIGURATION (Loaded AFTER Video)
    // ==========================================
    const AD_CONFIG = {
      popunderSrc: "https://abscloud.org/1/e6025b2f6245af1cdbbac6851eb3c2b8",
      banner320x50: {
        key: "30c51d3b7b4e9f007e1f43dfab8ac5c0",
        src: "https://bauval.org/22/30c51d3b7b4e9f007e1f43dfab8ac5c0",
        width: 320,
        height: 50
      },
      banner300x250: {
        key: "6104d8b774691024892059d0fb55ac0e",
        src: "https://bauval.org/22/6104d8b774691024892059d0fb55ac0e",
        width: 300,
        height: 250
      },
      nativeBanner: {
        src: "https://bauval.org/21/3f70743394b4399becdcd9c770f010ac",
        everyVideos: 4
      },
      socialBarSrc: "https://bauval.org/14/3ca91c9f7c933c4e4dc00b0183cff8c1",
      popunderEverySwitches: 4
    };

    let videos = [];
    let currentVideoId = null;
    let activeCategory = "All";
    let activeFeedFilter = "all";
    let searchQuery = "";
    let videoSwitchCount = 0;
    let popunderLoadedCount = 0;
    let isFloating = false;
    let floatingDismissed = false;

    let userState = JSON.parse(localStorage.getItem("vs_user_state")) || {
      likes: {},
      dislikes: {},
      favorites: {},
      subscriptions: {}
    };

    function saveUserState() {
      localStorage.setItem("vs_user_state", JSON.stringify(userState));
    }

    // ==========================================
    // 2. YOUTUBE-STYLE FLOATING & DRAGGABLE MINI PLAYER
    // ==========================================
    function setupFloatingMiniPlayer() {
      const sentinel = document.getElementById("player-sentinel");
      const playerBox = document.getElementById("player-box");
      const floatingControls = document.getElementById("floating-controls");
      const dockNotice = document.getElementById("floating-dock-notice");

      window.addEventListener("scroll", () => {
        if (!currentVideoId) return;
        const rect = sentinel.getBoundingClientRect();

        if (rect.bottom < 60) {
          if (!isFloating && !floatingDismissed) {
            isFloating = true;
            playerBox.classList.add("is-floating");
            floatingControls.classList.remove("hidden");
            dockNotice.classList.remove("hidden");

            if (!playerBox.dataset.positioned) {
              playerBox.style.left = `${Math.max(12, window.innerWidth - 224)}px`;
              playerBox.style.top = `${Math.max(70, window.innerHeight - 145)}px`;
            }
          }
        } else {
          floatingDismissed = false;
          if (isFloating) {
            exitFloatingMode();
          }
        }
      }, { passive: true });

      // Drag support (Touch + Mouse)
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let origLeft = 0;
      let origTop = 0;

      function onDragStart(clientX, clientY) {
        if (!isFloating) return;
        dragging = true;
        startX = clientX;
        startY = clientY;
        const rect = playerBox.getBoundingClientRect();
        origLeft = rect.left;
        origTop = rect.top;
      }

      function onDragMove(clientX, clientY) {
        if (!dragging || !isFloating) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        const maxLeft = window.innerWidth - playerBox.offsetWidth - 8;
        const maxTop = window.innerHeight - playerBox.offsetHeight - 8;
        const nextLeft = Math.min(Math.max(8, origLeft + dx), maxLeft);
        const nextTop = Math.min(Math.max(56, origTop + dy), maxTop);

        playerBox.style.left = `${nextLeft}px`;
        playerBox.style.top = `${nextTop}px`;
        playerBox.dataset.positioned = "1";
      }

      function onDragEnd() {
        dragging = false;
      }

      playerBox.addEventListener("touchstart", (e) => {
        if (e.target.tagName === "BUTTON") return;
        const t = e.touches[0];
        onDragStart(t.clientX, t.clientY);
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (!dragging) return;
        const t = e.touches[0];
        onDragMove(t.clientX, t.clientY);
      }, { passive: true });

      window.addEventListener("touchend", onDragEnd);

      playerBox.addEventListener("mousedown", (e) => {
        if (e.target.tagName === "BUTTON") return;
        onDragStart(e.clientX, e.clientY);
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        onDragMove(e.clientX, e.clientY);
      });

      window.addEventListener("mouseup", onDragEnd);
    }

    function exitFloatingMode() {
      const playerBox = document.getElementById("player-box");
      const floatingControls = document.getElementById("floating-controls");
      const dockNotice = document.getElementById("floating-dock-notice");

      isFloating = false;
      playerBox.classList.remove("is-floating");
      playerBox.style.left = "";
      playerBox.style.top = "";
      floatingControls.classList.add("hidden");
      dockNotice.classList.add("hidden");
    }

    function scrollToPlayerTop(e) {
      if (e) e.stopPropagation();
      floatingDismissed = false;
      exitFloatingMode();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function dismissFloatingPlayer(e) {
      if (e) e.stopPropagation();
      const player = document.getElementById("main-video-player");
      player.pause();
      floatingDismissed = true;
      exitFloatingMode();
    }

    // ==========================================
    // BANNER, SOCIAL BAR & POPUNDER HANDLERS
    // ==========================================
    function injectIframeBanner(containerId, config) {
      return new Promise((resolve) => {
        const container = document.getElementById(containerId);
        if (!container || !config) return resolve();

        container.innerHTML = "";

        window.atOptions = {
          key: config.key,
          format: "iframe",
          height: config.height,
          width: config.width,
          params: {}
        };

        const adScript = document.createElement("script");
        adScript.type = "text/javascript";
        adScript.src = config.src;
        adScript.async = true;

        adScript.onload = () => setTimeout(resolve, 300);
        adScript.onerror = () => setTimeout(resolve, 300);

        container.appendChild(adScript);
      });
    }

    async function initAdsAfterVideo() {
      await injectIframeBanner("banner-320x50-slot", AD_CONFIG.banner320x50);
      await injectIframeBanner("banner-300x250-slot", AD_CONFIG.banner300x250);
      initSocialBarRandomly();
    }

    function initSocialBarRandomly() {
      const alreadyShownThisSession = sessionStorage.getItem("vs_social_bar_loaded");
      if (alreadyShownThisSession) return;

      const shouldLoad = Math.random() < 0.6;
      if (!shouldLoad) return;

      const randomDelay = Math.floor(Math.random() * 5000) + 3000;
      setTimeout(() => {
        const holder = document.getElementById("ad-scripts-container");
        if (!holder) return;

        const s = document.createElement("script");
        s.src = AD_CONFIG.socialBarSrc;
        s.setAttribute("data-cfasync", "false");
        s.async = true;
        holder.appendChild(s);

        sessionStorage.setItem("vs_social_bar_loaded", "1");
      }, randomDelay);
    }

    function handlePopunderOnVideoSwitch() {
      videoSwitchCount += 1;

      if (videoSwitchCount % AD_CONFIG.popunderEverySwitches === 0 && popunderLoadedCount < 2) {
        popunderLoadedCount += 1;
        const holder = document.getElementById("ad-scripts-container");
        if (!holder) return;

        const popScript = document.createElement("script");
        popScript.src = `${AD_CONFIG.popunderSrc}?v=${Date.now()}_${popunderLoadedCount}`;
        popScript.setAttribute("data-cfasync", "false");
        popScript.async = true;
        holder.appendChild(popScript);
      }
    }

    function createNativeBannerCard(index) {
      const wrapper = document.createElement("div");
      wrapper.className = "native-ad-card flex flex-col items-center justify-center";

      const label = document.createElement("span");
      label.className = "w-full text-left text-[10px] uppercase tracking-wider text-gray-500 mb-1.5 font-semibold";
      label.textContent = "Sponsored";

      const adContainer = document.createElement("div");
      adContainer.id = `native-banner-slot-${index}`;
      adContainer.className = "w-full min-h-[70px] flex items-center justify-center";

      const script = document.createElement("script");
      script.async = true;
      script.setAttribute("data-cfasync", "false");
      script.src = AD_CONFIG.nativeBanner.src;

      wrapper.appendChild(label);
      wrapper.appendChild(adContainer);
      wrapper.appendChild(script);

      return wrapper;
    }

    // ==========================================
    // VIDEO PLAYER, SHARE LINK & UI LOGIC
    // ==========================================
    function getVideoSource(vid) {
      return (vid && (vid.videoUrl || vid.url)) || "";
    }

    function updateShareUrlParam(id) {
      if (!id) return;
      const url = new URL(window.location.href);
      url.searchParams.set("v", id);
      window.history.replaceState({}, "", url.toString());
    }

    function shareCurrentVideo() {
      if (!currentVideoId) return;
      const vid = videos.find(v => v.id === currentVideoId);
      const shareUrl = `${window.location.origin}${window.location.pathname}?v=${encodeURIComponent(currentVideoId)}`;

      if (navigator.share) {
        navigator.share({
          title: vid ? vid.title : "Watch Video",
          url: shareUrl
        }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("Video share link copied!");
        }).catch(() => {
          showToast(shareUrl);
        });
      } else {
        showToast("Share link ready in address bar");
      }
    }

    function loadVideo(id, isUserSwitch = false) {
      const player = document.getElementById("main-video-player");
      const placeholder = document.getElementById("empty-player-placeholder");
      const detailsSec = document.getElementById("video-details-section");
      const actionsSec = document.getElementById("video-actions-section");
      const descSec = document.getElementById("video-desc-section");

      const vid = videos.find(v => String(v.id) === String(id)) || videos[0];
      const streamUrl = getVideoSource(vid);

      if (!vid || !streamUrl) {
        currentVideoId = null;
        player.pause();
        player.removeAttribute("src");
        player.load();
        player.classList.add("hidden");
        placeholder.innerHTML = `
          <p class="text-sm font-bold text-gray-200 mb-1">No Video Available</p>
          <p class="text-xs text-gray-400">Add video links inside <code class="text-gray-200">videos.json</code> on GitHub.</p>
        `;
        placeholder.classList.remove("hidden");
        detailsSec.classList.add("hidden");
        actionsSec.classList.add("hidden");
        descSec.classList.add("hidden");
        renderRecommendations();
        return;
      }

      if (isUserSwitch) {
        handlePopunderOnVideoSwitch();
      }

      currentVideoId = vid.id;
      updateShareUrlParam(vid.id);

      player.classList.remove("hidden");
      placeholder.classList.add("hidden");
      detailsSec.classList.remove("hidden");
      actionsSec.classList.remove("hidden");
      descSec.classList.remove("hidden");

      player.poster = vid.thumbnail || DEFAULT_THUMB;
      player.src = streamUrl;
      player.load();
      if (isUserSwitch) {
        player.play().catch(() => {});
      }

      document.getElementById("video-title").textContent = vid.title || "Untitled Video";
      document.getElementById("channel-name").textContent = vid.creator || "My Channel";
      document.getElementById("channel-subs").textContent = vid.subs || "Creator";
      document.getElementById("channel-avatar").src = vid.thumbnail || DEFAULT_THUMB;
      document.getElementById("video-views").textContent = `${vid.views || "0"} views`;
      document.getElementById("video-date").textContent = vid.date || "";
      document.getElementById("video-description").textContent = vid.description || "";

      const tagsContainer = document.getElementById("video-hashtags");
      tagsContainer.innerHTML = (vid.hashtags || []).map(tag => `<span>${tag}</span>`).join("");

      updateInteractionUI();
      renderRecommendations();
      if (isUserSwitch) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    document.getElementById("main-video-player").addEventListener("error", () => {
      showToast("Video link could not play");
    });

    function updateInteractionUI() {
      const vid = videos.find(v => v.id === currentVideoId);
      if (!vid) return;

      const isLiked = !!userState.likes[vid.id];
      const isDisliked = !!userState.dislikes[vid.id];
      const isFav = !!userState.favorites[vid.id];
      const isSub = !!userState.subscriptions[vid.creator];

      const baseLikes = Number(vid.likes) || 0;
      const baseDislikes = Number(vid.dislikes) || 0;

      document.getElementById("like-count").textContent = (baseLikes + (isLiked ? 1 : 0)).toLocaleString();
      document.getElementById("dislike-count").textContent = (baseDislikes + (isDisliked ? 1 : 0)).toLocaleString();

      document.getElementById("like-icon").classList.toggle("fill-brand-red", isLiked);
      document.getElementById("like-icon").classList.toggle("fill-white", !isLiked);

      const favIcon = document.getElementById("fav-icon");
      favIcon.classList.toggle("text-pink-500", isFav);
      favIcon.classList.toggle("text-gray-400", !isFav);

      const subBtn = document.getElementById("subscribe-btn");
      if (isSub) {
        subBtn.textContent = "Subscribed";
        subBtn.className = "px-4 py-1.5 bg-[#252533] text-gray-200 text-xs font-bold rounded-full transition shrink-0";
      } else {
        subBtn.textContent = "Subscribe";
        subBtn.className = "px-4 py-1.5 bg-brand-crimson hover:bg-red-600 text-white text-xs font-bold rounded-full shadow-md shadow-brand-crimson/30 transition shrink-0";
      }
    }

    function toggleLike() {
      if (!currentVideoId) return;
      userState.likes[currentVideoId] = !userState.likes[currentVideoId];
      if (userState.likes[currentVideoId]) userState.dislikes[currentVideoId] = false;
      saveUserState();
      updateInteractionUI();
    }

    function toggleDislike() {
      if (!currentVideoId) return;
      userState.dislikes[currentVideoId] = !userState.dislikes[currentVideoId];
      if (userState.dislikes[currentVideoId]) userState.likes[currentVideoId] = false;
      saveUserState();
      updateInteractionUI();
    }

    function toggleFavorite() {
      if (!currentVideoId) return;
      userState.favorites[currentVideoId] = !userState.favorites[currentVideoId];
      saveUserState();
      updateInteractionUI();
      renderRecommendations();
      showToast(userState.favorites[currentVideoId] ? "Added to Favorites" : "Removed from Favorites");
    }

    function toggleSubscribe() {
      const vid = videos.find(v => v.id === currentVideoId);
      if (!vid) return;
      userState.subscriptions[vid.creator] = !userState.subscriptions[vid.creator];
      saveUserState();
      updateInteractionUI();
      showToast(userState.subscriptions[vid.creator] ? `Subscribed to ${vid.creator}` : "Unsubscribed");
    }

    function toggleDescription() {
      const desc = document.getElementById("video-description");
      const label = document.getElementById("desc-toggle-label");
      const isClamped = desc.classList.contains("line-clamp-2");
      desc.classList.toggle("line-clamp-2", !isClamped);
      label.textContent = isClamped ? "Show less" : "More";
    }

    function renderRecommendations() {
      const list = document.getElementById("recommendations-list");
      const filtered = videos.filter(v => {
        const matchesCat = activeCategory === "All" || v.category === activeCategory;
        const matchesFeed =
          activeFeedFilter === "all" ||
          (activeFeedFilter === "favorites" && userState.favorites[v.id]);
        const matchesSearch =
          !searchQuery ||
          (v.title || "").toLowerCase().includes(searchQuery) ||
          (v.creator || "").toLowerCase().includes(searchQuery) ||
          (v.hashtags || []).some(t => t.toLowerCase().includes(searchQuery));
        return matchesCat && matchesFeed && matchesSearch;
      });

      document.getElementById("queue-count").textContent = `${filtered.length} Video${filtered.length === 1 ? "" : "s"}`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-xs text-gray-400 bg-[#13131A] rounded-xl border border-brand-cardBorder/60">No videos found in videos.json.</div>`;
        return;
      }

      list.innerHTML = "";
      let nativeCount = 0;

      filtered.forEach((v, idx) => {
        const isPlaying = v.id === currentVideoId;
        const article = document.createElement("article");
        article.onclick = () => loadVideo(v.id, true);
        article.className = `flex space-x-3 bg-[#13131A] p-2 rounded-xl border ${isPlaying ? "border-brand-red" : "border-brand-cardBorder/60"} hover:border-brand-red/50 transition cursor-pointer`;

        article.innerHTML = `
          <div class="relative w-36 h-20 flex-shrink-0 rounded-lg overflow-hidden bg-slate-800">
            <img alt="${v.title}" class="w-full h-full object-cover" src="${v.thumbnail || DEFAULT_THUMB}" />
            ${isPlaying ? '<span class="absolute top-1 left-1 bg-brand-red text-white font-bold text-[9px] px-1.5 py-0.5 rounded">PLAYING</span>' : '<span class="absolute top-1 left-1 bg-black/75 text-white font-bold text-[9px] px-1 rounded">VIDEO</span>'}
            <span class="absolute bottom-1 right-1 bg-black/80 text-white text-[10px] font-mono px-1 rounded">${v.duration || "HD"}</span>
          </div>
          <div class="flex flex-col justify-between py-0.5 min-w-0 flex-1">
            <div>
              <h3 class="text-xs font-semibold text-white leading-tight line-clamp-2">${v.title}</h3>
              <p class="text-[11px] text-gray-400 mt-1 flex items-center">${v.creator || "My Channel"}</p>
            </div>
            <span class="text-[10px] text-gray-500">${v.views || "0"} views • ${v.date || ""}</span>
          </div>
        `;

        list.appendChild(article);

        if ((idx + 1) % AD_CONFIG.nativeBanner.everyVideos === 0) {
          nativeCount += 1;
          list.appendChild(createNativeBannerCard(nativeCount));
        }
      });
    }

    function filterByCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".cat-chip").forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-chip px-3.5 py-1.5 rounded-full bg-white text-black font-semibold whitespace-nowrap transition";
        } else {
          btn.className = "cat-chip px-3 py-1.5 rounded-full bg-[#1C1C24] text-gray-300 whitespace-nowrap border border-brand-cardBorder transition";
        }
      });
      renderRecommendations();
    }

    function setFeedFilter(filter) {
      activeFeedFilter = filter;
      document.querySelectorAll(".feed-pill").forEach(btn => {
        if (btn.dataset.feed === filter) {
          btn.className = "feed-pill px-3 py-1 rounded-full bg-white text-black font-semibold whitespace-nowrap";
        } else {
          btn.className = "feed-pill px-3 py-1 rounded-full bg-[#1A1A24] text-gray-300 border border-brand-cardBorder whitespace-nowrap";
        }
      });
      renderRecommendations();
    }

    function toggleSearch() {
      const bar = document.getElementById("search-bar-wrapper");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) {
        document.getElementById("search-input").focus();
      }
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderRecommendations();
    }

    function clearSearch() {
      document.getElementById("search-input").value = "";
      searchQuery = "";
      document.getElementById("search-bar-wrapper").classList.add("hidden");
      renderRecommendations();
    }

    function resetFilters() {
      filterByCategory("All");
      setFeedFilter("all");
      clearSearch();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.add("hidden"), 2400);
    }

    // ==========================================
    // 1. PRIORITY INIT: LOAD VIDEO FIRST, ADS AFTER
    // ==========================================
    async function initVideos() {
      setupFloatingMiniPlayer();

      try {
        const res = await fetch("./videos.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        videos = Array.isArray(data) ? data : [];
      } catch (err) {
        console.error("Failed to load videos.json:", err);
        videos = [];
        showToast("Could not load videos.json");
      }

      // Check shared video ID from URL (?v=1)
      const params = new URLSearchParams(window.location.search);
      const sharedId = params.get("v");
      const initialId = sharedId || (videos.length > 0 ? videos[0].id : null);

      // Load video & UI first
      loadVideo(initialId, false);

      // Load ads after video is initialized
      setTimeout(() => {
        initAdsAfterVideo();
      }, 600);
    }

    initVideos();
  </script>
</body>
</html>
